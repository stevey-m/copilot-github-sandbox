name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
 
      - name: Run HTMLHint
        run: npx --yes htmlhint index.html
 
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
 
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
 
      - name: Check script.js syntax
        run: node --check script.js
 
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
 
      - name: Check secret exists
        run: | 
          echo "Secret is set: ${{ secrets.DUMMY_KEY != '' }}"
 