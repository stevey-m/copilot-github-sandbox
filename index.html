<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot GitHub Sandbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Copilot GitHub Sandbox</h1>
    <p>A static, no-backend playground for testing GitHub Copilot-generated functions.</p>

    <section id="demo">
      <label for="inputValue">Enter something:</label>
      <input id="inputValue" type="text" placeholder="Type a value" />
      <button id="runBtn">Run Function</button>
      <pre id="output" aria-live="polite"></pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
